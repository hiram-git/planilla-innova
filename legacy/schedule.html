<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horarios con Tolerancias</title>
  <!-- AdminLTE CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="container-fluid mt-4">

  <div class="card">
    <div class="card-header bg-primary">
      <h3 class="card-title text-white">Configuración de Horario</h3>
    </div>
    <div class="card-body">

      <!-- Fila de horarios -->
      <div class="row">

        <!-- 1. ENTRADA -->
        <div class="col-lg-3 col-md-6 col-12 mb-3">
          <label class="font-weight-bold">Entrada</label>
          <div class="form-group mb-2">
            <input type="time" class="form-control text-center" name="hora_entrada" required>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="fas fa-clock"></i></span>
                </div>
                <input type="number" class="form-control" name="tol_entrada_entrada" placeholder="Tol. Entrada (min)" min="0" value="0">
              </div>
            </div>
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="fas fa-clock"></i></span>
                </div>
                <input type="number" class="form-control" name="tol_salida_entrada" placeholder="Tol. Salida (min)" min="0" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- 2. SALIDA ALMUERZO -->
        <div class="col-lg-3 col-md-6 col-12 mb-3">
          <label class="font-weight-bold">Salida Almuerzo</label>
          <div class="form-group mb-2">
            <input type="time" class="form-control text-center" name="hora_salida_almuerzo">
          </div>
          <div class="row">
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_entrada_salalm" placeholder="Tol. Entrada (min)" min="0" value="0">
              </div>
            </div>
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_salida_salalm" placeholder="Tol. Salida (min)" min="0" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- 3. REGRESO ALMUERZO -->
        <div class="col-lg-3 col-md-6 col-12 mb-3">
          <label class="font-weight-bold">Regreso Almuerzo</label>
          <div class="form-group.mb-2">
            <input type="time" class="form-control text-center" name="hora_regreso_almuerzo">
          </div>
          <div class="row">
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_entrada_regalm" placeholder="Tol. Entrada (min)" min="0" value="0">
              </div>
            </div>
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_salida_regalm" placeholder="Tol. Salida (min)" min="0" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- 4. SALIDA FINAL -->
        <div class="col-lg-3 col-md-6 col-12 mb-3">
          <label class="font-weight-bold">Salida</label>
          <div class="form-group mb-2">
            <input type="time" class="form-control text-center" name="hora_salida" required>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_entrada_salida" placeholder="Tol. Entrada (min)" min="0" value="0">
              </div>
            </div>
            <div class="col-6">
              <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-clock"></i></span></div>
                <input type="number" class="form-control" name="tol_salida_salida" placeholder="Tol. Salida (min)" min="0" value="0">
              </div>
            </div>
          </div>
        </div>

      </div>
      <!-- /.row -->

    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>

<!-- Scripts necesarios -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
